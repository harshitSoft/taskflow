spring.application.name=backend
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Bootstrap Admin Configuration
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@taskflow.local}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:System Admin}